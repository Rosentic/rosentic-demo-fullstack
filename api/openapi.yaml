openapi: "3.0.3"
info:
  title: Rosentic Demo API
  version: "1.0.0"
  description: Fullstack demo API for order management

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/users:
    get:
      summary: List all users
      operationId: listUsers
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /api/users/{id}:
    get:
      summary: Get a user by ID
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/orders:
    get:
      summary: List orders
      operationId: listOrders
      responses:
        "200":
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid request

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    CreateOrderRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          description: The product to order
        quantity:
          type: integer
          description: Number of items
          minimum: 1

    Order:
      type: object
      required:
        - id
        - product_id
        - quantity
        - status
      properties:
        id:
          type: integer
        product_id:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered]
