query GetUser($id: ID!) {
  user(id: $id) {
    id
    name
    email
    avatar
  }
}

query ListUsers {
  users {
    id
    name
    email
    avatar
  }
}

mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    name
    email
  }
}

query GetUserOrders($userId: ID!) {
  orders(userId: $userId) {
    id
    productId
    quantity
    status
  }
}

query GetUserProfile($id: ID!) {
  user(id: $id) {
    id
    name
    email
    avatar
    orders {
      id
      status
    }
  }
}
