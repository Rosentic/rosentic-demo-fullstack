query LegacyGetUser($id: ID!) {
  user(id: $id) {
    id
    name
    email
    avatar
  }
}

query LegacyListUsers {
  users {
    id
    name
    email
    avatar
  }
}

mutation LegacyCreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    name
    email
  }
}

query LegacyGetUserProfile($id: ID!) {
  user(id: $id) {
    id
    name
    email
    avatar
    orders {
      id
      status
    }
  }
}
